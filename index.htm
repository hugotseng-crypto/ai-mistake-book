<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>錯題本</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root { --bg:#F2F2F7; --card:#fff; --text:#111; --muted:#6C6C70; --blue:#007AFF; --green:#34C759; --red:#FF3B30; --purple:#9333EA; --border:rgba(60,60,67,.18); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--text); padding-bottom:88px; }
  .nav { position:sticky; top:0; z-index:20; background:rgba(255,255,255,.9); backdrop-filter:blur(20px); border-bottom:.5px solid var(--border); padding:14px 16px; text-align:center; font-weight:800; }
  .wrap { padding:16px; max-width:720px; margin:0 auto; }
  .card { background:var(--card); border-radius:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); padding:16px; margin-bottom:14px; }
  .hint { font-size:12px; color:var(--muted); margin:8px 0 12px; line-height:1.5; }
  .row { display:flex; gap:10px; }
  .btn { border:none; border-radius:12px; padding:13px 14px; font-size:15px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .btn-blue { background:var(--blue); color:#fff; } .btn-gray { background:#6C6C70; color:#fff; }
  .btn-green { background:var(--green); color:#fff; } .btn-purple { background:var(--purple); color:#fff; }
  .btn-light { background:var(--bg); color:var(--text); } .btn-danger { background:#fff; color:var(--red); border:1px solid #ffd0ce; }
  .btn[disabled] { opacity:.5; }
  input[type=file] { display:none; }
  input[type=text], select, textarea { width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--bg); font-size:15px; font-family:inherit; }
  textarea { min-height:88px; resize:vertical; }
  label.field { display:block; font-size:12px; font-weight:700; color:var(--muted); margin:10px 0 6px; }
  #cropWrap { display:none; background:#000; border-radius:12px; overflow:hidden; max-height:58vh; margin:12px 0; }
  #cropWrap img { max-width:100%; }
  .tabs { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.95); backdrop-filter:blur(20px); border-top:.5px solid var(--border); display:flex; z-index:30; }
  .tab { flex:1; padding:12px 8px 16px; text-align:center; font-size:13px; font-weight:700; color:var(--muted); background:none; border:none; }
  .tab.on { color:var(--blue); }
  .page { display:none; } .page.on { display:block; }
  .q-item { display:flex; gap:12px; padding:10px 0; border-bottom:.5px solid var(--border); cursor:pointer; }
  .q-item img { width:72px; height:72px; object-fit:cover; border-radius:10px; background:#eee; flex-shrink:0; }
  .q-meta { font-size:12px; color:var(--muted); margin-top:4px; }
  .empty { text-align:center; color:var(--muted); padding:40px 16px; }
  .detail-img { width:100%; border-radius:12px; background:#eee; margin-bottom:12px; }
  .tag { display:inline-block; background:#eee; border-radius:6px; padding:2px 8px; font-size:12px; margin:0 4px 4px 0; }
  #toast { position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:#111; color:#fff; padding:10px 16px; border-radius:20px; font-size:13px; display:none; z-index:50; }
  .check { width:20px; height:20px; margin-top:26px; }
</style>
</head>
<body>
<div class="nav" id="navTitle">錯題本</div>
<div class="wrap">
  <div id="pageCapture" class="page on">
    <div class="card">
      <div style="font-weight:800">拍下一題</div>
      <div class="hint">先框出不會或做錯的那一題並存檔。AI 講解可以之後再按。</div>
      <div class="row">
        <label for="cameraInput" class="btn btn-blue" style="flex:1">拍照</label>
        <label for="fileInput" class="btn btn-gray" style="flex:1">相簿／檔案</label>
      </div>
      <input type="file" id="cameraInput" accept="image/*" capture="environment">
      <input type="file" id="fileInput" accept="image/*">
      <div id="cropWrap"><img id="cropImg" alt=""></div>
      <div class="row" id="cropBar" style="display:none;margin-top:10px">
        <button class="btn btn-light" type="button" onclick="rotate(-90)">左轉</button>
        <button class="btn btn-light" type="button" onclick="rotate(90)">右轉</button>
        <button class="btn btn-blue" type="button" style="flex:1" onclick="confirmCrop()">確定範圍</button>
      </div>
    </div>
    <div class="card" id="saveCard" style="display:none">
      <div style="font-weight:800">確認後存入錯題本</div>
      <img id="preview" class="detail-img" alt="預覽" style="margin-top:12px">
      <label class="field">科目</label>
      <input type="text" id="subjectInput" placeholder="例如：數學、英文、物理" list="subjectList">
      <datalist id="subjectList"></datalist>
      <label class="field">我當時的答案（選填）</label>
      <input type="text" id="myAnswerInput" placeholder="例如：B 或 24">
      <label class="field">備註（選填）</label>
      <textarea id="noteInput" placeholder="哪裡不會、考試名稱…"></textarea>
      <button class="btn btn-green" type="button" style="width:100%;margin-top:14px" onclick="saveQuestion()">存入錯題本</button>
    </div>
  </div>
  <div id="pageBook" class="page">
    <div class="card">
      <div class="row" style="align-items:center;margin-bottom:8px">
        <div style="font-weight:800;flex:1">我的錯題</div>
        <button class="btn btn-light" type="button" onclick="exportSelected()">匯出勾選</button>
      </div>
      <select id="subjectFilter" onchange="renderList()"></select>
      <div id="list"></div>
    </div>
  </div>
  <div id="pageDetail" class="page">
    <div class="card" id="detailCard"></div>
  </div>
</div>
<div class="tabs">
  <button class="tab on" id="tabCapture" type="button" onclick="showPage('capture')">拍照存題</button>
  <button class="tab" id="tabBook" type="button" onclick="showPage('book')">錯題本</button>
</div>
<div id="toast"></div>
<script>
const STORE_KEY = 'mistakeBook.v1';
let cropper = null;
let pendingImage = '';
let viewingId = null;
function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return { version: 1, questions: [] };
    const data = JSON.parse(raw);
    if (!Array.isArray(data.questions)) data.questions = [];
    return data;
  } catch (e) { return { version: 1, questions: [] }; }
}
function saveStore(store) { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 1800);
}
function uid() { return 'q_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function subjects() { return [...new Set(loadStore().questions.map(q => q.subject).filter(Boolean))]; }
function showPage(name, id) {
  document.getElementById('pageCapture').classList.toggle('on', name === 'capture');
  document.getElementById('pageBook').classList.toggle('on', name === 'book');
  document.getElementById('pageDetail').classList.toggle('on', name === 'detail');
  document.getElementById('tabCapture').classList.toggle('on', name === 'capture');
  document.getElementById('tabBook').classList.toggle('on', name === 'book' || name === 'detail');
  document.getElementById('navTitle').textContent = name === 'detail' ? '題目詳情' : '錯題本';
  if (name === 'book') renderList();
  if (name === 'detail') renderDetail(id);
}
function onFile(e) {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('請拍或選圖片。PDF 請先截成單一題目圖'); return; }
  const url = URL.createObjectURL(file);
  const img = document.getElementById('cropImg');
  document.getElementById('cropWrap').style.display = 'block';
  document.getElementById('cropBar').style.display = 'flex';
  document.getElementById('saveCard').style.display = 'none';
  if (cropper) cropper.destroy();
  img.src = url;
  img.onload = () => { cropper = new Cropper(img, { viewMode: 2, dragMode: 'move', autoCropArea: 1, guides: true }); };
}
document.getElementById('cameraInput').addEventListener('change', onFile);
document.getElementById('fileInput').addEventListener('change', onFile);
function rotate(deg) { if (cropper) cropper.rotate(deg); }
function compress(dataUrl, maxW, quality) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}
async function confirmCrop() {
  if (!cropper) return;
  const canvas = cropper.getCroppedCanvas({ maxWidth: 1600, maxHeight: 1600 });
  pendingImage = await compress(canvas.toDataURL('image/jpeg', 0.85), 1200, 0.72);
  document.getElementById('preview').src = pendingImage;
  document.getElementById('saveCard').style.display = 'block';
  document.getElementById('subjectList').innerHTML = subjects().map(s => '<option value="'+s+'"></option>').join('');
  document.getElementById('saveCard').scrollIntoView({ behavior: 'smooth' });
}
function saveQuestion() {
  if (!pendingImage) { toast('請先框選題目'); return; }
  const store = loadStore();
  store.questions.unshift({
    id: uid(), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
    subject: document.getElementById('subjectInput').value.trim() || '未分類',
    tags: [], stem: '', solution: '',
    note: document.getElementById('noteInput').value.trim(),
    myAnswer: document.getElementById('myAnswerInput').value.trim(),
    wrongType: '', status: 'new', imageDataUrl: pendingImage
  });
  saveStore(store);
  pendingImage = '';
  document.getElementById('saveCard').style.display = 'none';
  document.getElementById('cropWrap').style.display = 'none';
  document.getElementById('cropBar').style.display = 'none';
  document.getElementById('myAnswerInput').value = '';
  document.getElementById('noteInput').value = '';
  toast('已存入錯題本');
  showPage('book');
}
function renderList() {
  const store = loadStore();
  const filter = document.getElementById('subjectFilter');
  const current = filter.value;
  filter.innerHTML = ['全部', ...subjects()].map(s => '<option'+(s===current?' selected':'')+'>'+s+'</option>').join('');
  const items = store.questions.filter(q => !filter.value || filter.value === '全部' || q.subject === filter.value);
  const box = document.getElementById('list');
  if (!items.length) { box.innerHTML = '<div class="empty">還沒有錯題。先去拍一題存下來。</div>'; return; }
  box.innerHTML = items.map(q => '<div class="q-item"><input class="check" type="checkbox" data-id="'+q.id+'" onclick="event.stopPropagation()"><img src="'+q.imageDataUrl+'" alt="" onclick="showPage(\'detail\',\''+q.id+'\')"><div style="flex:1" onclick="showPage(\'detail\',\''+q.id+'\')"><div style="font-weight:700">'+(q.subject||'未分類')+'</div><div class="q-meta">'+new Date(q.createdAt).toLocaleString()+(q.solution?' · 已有解析':' · 尚未解析')+'</div><div class="q-meta">'+((q.stem||q.note||'尚未加文字').slice(0,42))+'</div></div></div>').join('');
}
function getQ(id) { return loadStore().questions.find(q => q.id === id); }
function escapeText(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&','<':'<','>':'>'}[c])); }
function escapeAttr(s) { return escapeText(s).replace(/"/g, '"'); }
function renderDetail(id) {
  viewingId = id || viewingId;
  const q = getQ(viewingId);
  if (!q) { showPage('book'); return; }
  document.getElementById('detailCard').innerHTML =
    '<button class="btn btn-light" type="button" onclick="showPage(\'book\')">← 返回列表</button>' +
    '<img class="detail-img" src="'+q.imageDataUrl+'" alt="" style="margin-top:12px">' +
    '<label class="field">科目</label><input type="text" id="dSubject" value="'+escapeAttr(q.subject||'')+'">' +
    '<label class="field">我的答案</label><input type="text" id="dAnswer" value="'+escapeAttr(q.myAnswer||'')+'">' +
    '<label class="field">題目文字</label><textarea id="dStem">'+escapeText(q.stem||'')+'</textarea>' +
    '<label class="field">筆記</label><textarea id="dNote">'+escapeText(q.note||'')+'</textarea>' +
    '<label class="field">解析</label><textarea id="dSolution" style="min-height:120px">'+escapeText(q.solution||'')+'</textarea>' +
    '<div style="margin:8px 0">'+(q.tags||[]).map(t => '<span class="tag">#'+escapeText(t)+'</span>').join('')+'</div>' +
    '<button class="btn btn-purple" type="button" id="aiBtn" style="width:100%;margin:8px 0" onclick="askAI()">請 AI 講這題</button>' +
    '<div class="row"><button class="btn btn-green" type="button" style="flex:1" onclick="saveDetail()">儲存修改</button><button class="btn btn-danger" type="button" onclick="deleteQ()">刪除</button></div>';
}
function saveDetail() {
  const store = loadStore();
  const q = store.questions.find(x => x.id === viewingId); if (!q) return;
  q.subject = document.getElementById('dSubject').value.trim() || '未分類';
  q.myAnswer = document.getElementById('dAnswer').value.trim();
  q.stem = document.getElementById('dStem').value.trim();
  q.note = document.getElementById('dNote').value.trim();
  q.solution = document.getElementById('dSolution').value.trim();
  q.updatedAt = new Date().toISOString(); saveStore(store); toast('已儲存');
}
function deleteQ() {
  if (!confirm('確定刪除這題？')) return;
  const store = loadStore();
  store.questions = store.questions.filter(q => q.id !== viewingId);
  saveStore(store); toast('已刪除'); showPage('book');
}
async function askAI() {
  const q = getQ(viewingId); if (!q || !q.imageDataUrl) return;
  const btn = document.getElementById('aiBtn'); btn.disabled = true; btn.textContent = 'AI 閱讀中…';
  try {
    const response = await fetch('/api/analyze', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ fileBase64: q.imageDataUrl, mimeType: 'image/jpeg' }) });
    const result = await response.json();
    if (result.error) throw new Error(result.error);
    const first = Array.isArray(result.data) ? result.data[0] : result.data;
    if (!first) throw new Error('沒有解析結果');
    const store = loadStore();
    const target = store.questions.find(x => x.id === viewingId);
    target.stem = first.content || target.stem;
    target.solution = first.solution || target.solution;
    target.tags = first.tags || [];
    target.updatedAt = new Date().toISOString();
    saveStore(store); renderDetail(viewingId); toast('解析已填入，可再修改');
  } catch (err) {
    toast('分析失敗：' + err.message);
    const b = document.getElementById('aiBtn'); if (b) { b.disabled = false; b.textContent = '請 AI 講這題'; }
  }
}
function exportSelected() {
  const ids = [...document.querySelectorAll('.check:checked')].map(el => el.dataset.id);
  const items = loadStore().questions.filter(q => ids.includes(q.id));
  if (!items.length) { toast('請先勾選要匯出的題'); return; }
  const box = document.createElement('div');
  box.style.padding = '24px'; box.style.fontFamily = 'sans-serif';
  box.innerHTML = '<h2 style="text-align:center">錯題本</h2><p style="text-align:center;color:#666;font-size:12px">'+new Date().toLocaleString()+'</p>' +
    items.map(q => '<div style="margin:22px 0;page-break-inside:avoid"><h3>'+(q.subject||'')+(q.myAnswer?'（我的答案：'+q.myAnswer+'）':'')+'</h3>'+(q.imageDataUrl?'<img src="'+q.imageDataUrl+'" style="max-width:100%;border-radius:8px">':'')+'<p><b>題目</b><br>'+(q.stem||'').replace(/\n/g,'<br>')+'</p><p><b>筆記</b><br>'+(q.note||'').replace(/\n/g,'<br>')+'</p><p><b>解析</b><br>'+(q.solution||'').replace(/\n/g,'<br>')+'</p></div>').join('');
  html2pdf().set({ margin:12, filename:'錯題本.pdf', image:{type:'jpeg',quality:0.92}, html2canvas:{scale:2}, jsPDF:{unit:'mm',format:'a4',orientation:'portrait'} }).from(box).save();
}
renderList();
</script>
</body>
</html>
